# ssh 是这台机器【唯一】的救命通道（没有串口）。
#
# 主机密钥：rescue 镜像在构建时就生成好了（每次开机指纹不变，自动化不会撞 host key 变更）。
# ⚠️ 公开的 live 镜像【不带】主机密钥 —— 大家共用一把私钥等于没有加密 —— 所以这里现生成。
#    ssh-keygen -A 只补缺的，对 rescue 是空操作。
[Unit]
After=gk3-wifi.service

[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
# 启动介质上的公钥（gaokun3/authorized_keys）并进 /root/.ssh —— 为什么不让 sshd 直接认，见脚本头
ExecStartPre=/usr/lib/gaokun3/gk3-ssh-keys
ExecStartPre=/usr/sbin/sshd -t
